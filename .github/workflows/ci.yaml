---
name: CI

on: push

jobs:
  build:
    name: Build
    runs-on: "ubuntu-latest"

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3 
        with:
          crate: wasm-pack
          version: '^0.13'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: latest

      - run: wasm-pack build

      - run: pnpm install
        working-directory: www
      - run: pnpm run build
        working-directory: www

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www/dist

  deploy:
    name: Deploy
    runs-on: "ubuntu-latest"
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
